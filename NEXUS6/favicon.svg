<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Dark Premium Radial Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="60%" stop-color="#08090d"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>

    <!-- Eclipse Horizon/Corona Glow -->
    <radialGradient id="coronaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="88%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon Metallic Shadow Gradient -->
    <linearGradient id="moonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gold Accent Ring for Solar Ring Effect -->
    <linearGradient id="eclipseRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Outer Eclipse Corona Aura -->
  <circle cx="256" cy="280" r="170" fill="url(#coronaGlow)" />

  <!-- Eclipsed Light Rim (Solar Diamond Ring) -->
  <circle cx="256" cy="280" r="132" fill="none" stroke="url(#eclipseRim)" stroke-width="6" filter="url(#glow)" opacity="0.95"/>

  <!-- Dark Eclipsing Moon Body (Setting Downward) -->
  <circle cx="256" cy="280" r="130" fill="url(#moonBody)"/>

  <!-- Eclipsing Shadow Overlay (Crescent Cutout Effect) -->
  <path d="M 126 280 A 130 130 0 0 0 386 280 A 136 136 0 0 1 126 280 Z" fill="#020204" opacity="0.85"/>

  <!-- Subtle Horizon Line for Setting Aesthetic -->
  <line x1="90" y1="380" x2="422" y2="380" stroke="#1e293b" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="140" y1="405" x2="372" y2="405" stroke="#0f172a" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
